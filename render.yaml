services:
  - type: web
    name: slack-adr-bot
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:render
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SSH_PRIVATE_KEY
        sync: false
      - key: SSH_USER
        sync: false
      - key: SSH_HOST
        sync: false
      - key: DB_HOST_REMOTE
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_STATE_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: NOTION_DATASOURCE_ID
        sync: false
      - key: NOTION_CLIENT_ID
        sync: false
      - key: NOTION_CLIENT_SECRET
        sync: false
      - key: NOTION_REDIRECT_URI
        sync: false
      - key: APP_URL
        sync: false
